neoforge_121_minecraft_version=1.21.1
neoforge_121_version=21.1.234
neoforge_121_version_range=[21.1,)

# NeoForged 的 maven 在某些网络上会先返回不可达的 AAAA 记录，强制 IPv4 并加大重试，
# 避免 Gradle 以 "Connection reset" 结束。依赖已经缓存时这些设置没有副作用。
org.gradle.jvmargs=-Xmx3G -Djava.net.preferIPv4Stack=true
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=1000
